  <!-- Custom Gallery Script -->
  <script>
    const imageMapping = {
      "Education": ["2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpg"],
      "Festivals": ["7.jpg", "8.jpg", "9.jpg", "10.jpg", "11.jpg"],
      "Food": ["12.jpg", "13.jpg", "14.jpg", "15.jpg", "16.jpg", "17.jpg"]
    };

    let mainSwiper, thumbsSwiper;

    document.querySelectorAll('.folder-card').forEach(card => {
      const folderName = card.querySelector('.folder-name').innerText.trim();
      if (imageMapping[folderName]) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', () => {
          openGallery(imageMapping[folderName]);
        });
      }
    });

    function openGallery(images) {
      const modal = document.getElementById('customGalleryModal');
      const mainWrapper = document.getElementById('galleryMainWrapper');
      const thumbsWrapper = document.getElementById('galleryThumbsWrapper');

      mainWrapper.innerHTML = '';
      thumbsWrapper.innerHTML = '';

      images.forEach(img => {
        mainWrapper.innerHTML += `<div class="swiper-slide"><img src="assets/more_images/${img}" alt=""></div>`;
        thumbsWrapper.innerHTML += `<div class="swiper-slide"><img src="assets/more_images/${img}" alt=""></div>`;
      });

      modal.style.display = 'flex';

      if (thumbsSwiper) thumbsSwiper.destroy();
      if (mainSwiper) mainSwiper.destroy();

      thumbsSwiper = new Swiper('.gallery-thumbs', {
        spaceBetween: 10,
        slidesPerView: 4,
        freeMode: true,
        watchSlidesProgress: true,
        breakpoints: {
          640: { slidesPerView: 5 },
          768: { slidesPerView: 7 }
        }
      });

      mainSwiper = new Swiper('.gallery-main', {
        spaceBetween: 10,
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        thumbs: {
          swiper: thumbsSwiper
        }
      });
    }

    function closeGallery() {
      document.getElementById('customGalleryModal').style.display = 'none';
    }
  </script>

  <!-- Gallery Modal -->
  <div id="customGalleryModal" class="custom-gallery-modal">
    <span class="gallery-close" onclick="closeGallery()">&times;</span>
    <div class="gallery-container">
      <div class="swiper gallery-main">
        <div class="swiper-wrapper" id="galleryMainWrapper"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
      <div class="swiper gallery-thumbs">
        <div class="swiper-wrapper" id="galleryThumbsWrapper"></div>
      </div>
    </div>
  </div>
